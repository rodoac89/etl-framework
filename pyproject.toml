[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "etl-framework"
version = "0.1.0"
description = "Detección estática de buenas prácticas para ETL en HiveQL y PySpark."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rodolfo Aravena Collipal" }]

[project.scripts]
etl-check = "etl_framework.cli:main"

[tool.setuptools.packages.find]
include = ["etl_framework*"]
